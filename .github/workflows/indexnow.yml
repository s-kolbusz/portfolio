name: IndexNow — Notify Search Engines

# Runs automatically after a successful Vercel production deployment.
# Vercel calls this via its GitHub Deployment webhook when the environment is "Production".
#
# HOW IT WORKS:
#   1. Vercel deploys the site and marks the GitHub deployment as "success" for environment "Production"
#   2. GitHub triggers this workflow
#   3. The script fetches /sitemap.xml from the live site, extracts all <loc> URLs,
#      and POSTs them to https://api.indexnow.org/indexnow
#   4. Search engines (Bing, Yandex, and others in the IndexNow consortium) are notified
#      to re-crawl the updated pages immediately — no waiting for their own crawl schedule
#
# REQUIREMENTS:
#   - The IndexNow key file must exist at public/<KEY>.txt (already committed)
#   - The file content must match the filename (e.g. 03FD1F23...txt contains "03FD1F23...")
#   - No secrets needed — the key is intentionally public
#
# MANUAL RUN:
#   pnpm seo:indexnow          # Submit all sitemap URLs to IndexNow
#   pnpm seo:indexnow:dry      # Preview URLs that would be submitted (no network request)

on:
  deployment_status:

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    # Only run when Vercel marks the Production deployment as successful
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned like every other workflow. On "latest" this job silently
          # moved to pnpm 11, which stopped reading `pnpm.overrides` from
          # package.json and broke `install --frozen-lockfile`.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build

      # Cloudflare answers datacenter IPs with a managed challenge, so a runner
      # fetching https://kolbusz.xyz/sitemap.xml gets a 403 challenge page
      # instead of XML. Serve the same sitemap route locally and read it there.
      # SITE_ORIGIN is a constant, so the URLs inside still point at the
      # production host — which is what gets submitted.
      - name: Submit all sitemap URLs to IndexNow
        run: |
          set -euo pipefail

          # Redirecting the server's output is what keeps the job from hanging:
          # a background process holding the step's stdout open blocks the step
          # from finishing. The listener re-parents itself away from whatever
          # started it, so the trap matches it by name rather than by PID.
          pnpm start > /tmp/next-start.log 2>&1 &
          trap 'pkill -f next-server 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/sitemap.xml; then
              node ./scripts/submit-indexnow.mjs --sitemap-origin=http://localhost:3000
              exit 0
            fi
            sleep 1
          done

          echo "Server did not come up in time" >&2
          exit 1
